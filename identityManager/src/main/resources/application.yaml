spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST_PG}:5432/testdb
    username: mynewuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database: postgresql
  jwt:
    secret: secret
    expiration: 3600000

server:
  port: 8081

